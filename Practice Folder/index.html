<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            margin:0px;
            padding: 0px;
            display:flex;
            justify-content: center;
            height: 100vh;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        img{
            width: 100px;
            height: 100px;
            border-radius: 50px;
            position:absolute;
            bottom:80%;
            right: 50%;
            left: 40%;
        }

        .container{
            width:500px;
            height:100px;
            background-color: slateblue;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            min-width: 400px;
            padding: 70px 20px;
            margin: 5px;
            color: white;
            position: relative;
        }
        .username {
            font-size: 20px;
            font-weight: 100;
            color: black

}
    </style>
</head>
<body>
    <div class="container">
        <img src="https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=880&q=80"  alt="Image">

        <p class="text">Indeed, the most noble of you in the sight of Allah is the most righteous of you.” — Surah Al-Hujurat 49:13</p>

        <h1 class="username">Ali Jamadar</h1>
    </div>

    <script>
        const images = [
            {
                name:"Ali Jamadar",
                photoUrl: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=880&q=80",

                text:"This is simply unbelievable! I would be lost without Apple.The Very best. Not ale to tell you how happy i am with Apple"
            },
            {
                name:"Zara Jamadar",
                photoUrl:"https://images.unsplash.com/photo-1633332755192-727a05c4013d?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=880&q=80",
                text:"Allah does not burden a soul beyond that it can bear,Your Lord has not abandoned you, nor has He detested you."
            },
            {
                name: "Hasnain Shaikh",
                photoUrl: "https://images.unsplash.com/photo-1628157588553-5eeea00af15c?ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&ixlib=rb-1.2.1&auto=format&fit=crop&w=880&q=80",
                text: "Indeed, the most noble of you in the sight of Allah is the most righteous of you.” — Surah Al-Hujurat 49:13"

            }
        ];

        const image = document.querySelector("img")
        const textEl = document.querySelector(".text")
        const usernameEl = document.querySelector(".username")

        let index = 0;

        function updateImageContent(){
            const{name,photoUrl,text} = images[index]
            image.src=photoUrl;
            textEl.innerText = text;
            usernameEl.innerText = name
            index++;

            if(index === images.length){
                index=0;
            }

            setTimeout(()=>{
                updateImageContent()
            },4000)
        }

        updateImageContent()
    </script>
</body>
</html>
